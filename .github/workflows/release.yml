# 发版流水线（Obsidian 同款约定：tag = manifest version，无 v 前缀）。
# 本插件零构建：main.js / manifest.json 即仓库根的运行期文件，Action 直接打包发 Release。
name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != manifest version $VERSION"
            exit 1
          fi

      - name: Generate checksums
        run: |
          FILES="main.js manifest.json"
          [ -f styles.css ] && FILES="$FILES styles.css"
          sha256sum $FILES > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            checksums.txt
